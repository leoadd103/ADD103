<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>>Haunted Mansion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-pan-right">
    <header>
      <h1 class="tracking-in-expand">Haunted Mansion</h1>
      <p>Animista Animation Showcase</p>
    </header>

    <main>
      <section class="mansion">
        <img src="images/moon.png" alt="Haunted moon" class="rotate-center" />

        <img src="images/bat.png" alt="Flying bat" class="slide-in-top" />

        <div class="ghost-area">
          <img src="images/ghost.png" alt="Haunted ghost" class="fade-out" />
        </div>

        <div class="card">
          <h2>Welcome to the Mansion</h2>
          <p>
            Explore the spooky mansion.
          </p>

          <button class="heartbeat">Enter the Mansion</button>
        </div>
      </section>
    </main>

    <footer>
      <p>
        <a href="../../index.html">Back to Student Portal</a>
      </p>
    </footer>
  </body>
</html>
