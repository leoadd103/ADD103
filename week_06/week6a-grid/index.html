<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Culinary Photo Wall</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hero">
      <div class="hero-text">
        <h1>Culinary Recipes</h1>
        <p>
          Explore delicious foods and find inspiration for your next recipe.
        </p>
        <a href="#photos">View Photos</a>
      </div>

      <div class="hero-img">
        <img src="../week6a-grid/images/salad.jpg" alt="Chicken Caesar Salad" />
      </div>
    </div>

    <main>
      <h2>Food Photo Wall</h2>

      <div class="photo-wall" id="photos">
        <img
          src="https://placehold.co/600x400?text=Appetizer"
          alt="Appetizer"
        />
        <img src="https://placehold.co/600x400?text=Pasta" alt="Pasta" />
        <img src="https://placehold.co/600x400?text=Salad" alt="Salad" />
        <img src="https://placehold.co/600x400?text=Pizza" alt="Pizza" />
        <img src="https://placehold.co/600x400?text=Dessert" alt="Dessert" />
        <img src="https://placehold.co/600x400?text=Dinner" alt="Dinner" />
      </div>
    </main>

    <footer>
      <a href="../../index.html">Back to Student Portal</a>
    </footer>
  </body>
</html>
